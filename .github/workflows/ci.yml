name: CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Run tests
        run: pytest tests/ -v

  digest-check:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run fixture-backed digest validation
        run: |
          pytest \
            tests/test_pipeline_daily.py \
            tests/test_pipeline_deep.py \
            tests/test_renderer.py \
            tests/test_run_manual.py \
            tests/test_phase6_ops.py \
            -v

      - name: Run stubbed daily radar dry run
        env:
          ANDYJUAN_PIPELINE_STUB_CAPTURE: ${{ runner.temp }}/daily-radar-dry-run.json
        run: python -m src.main --mode daily --dry-run

  run-radar:
    needs: lint-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      OPENROUTER_API_KEY: stub-openrouter
      AGENTMAIL_API_KEY: stub-agentmail
      AGENTMAIL_INBOX_ID: stub-inbox
      EMAIL_FROM: stub@example.com
      NEWSDATA_API_KEY: stub-newsdata
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve run configuration
        id: config
        run: |
          echo "mode=daily" >> "$GITHUB_OUTPUT"
          echo "dry_run_flag=--dry-run" >> "$GITHUB_OUTPUT"
          echo "juan_only_flag=" >> "$GITHUB_OUTPUT"

      - name: Show resolved configuration
        run: |
          echo "event=pull_request"
          echo "mode=${{ steps.config.outputs.mode }}"
          echo "dry_run_flag=${{ steps.config.outputs.dry_run_flag }}"

      - name: Validate required secrets
        env:
          DRY_RUN_FLAG: ${{ steps.config.outputs.dry_run_flag }}
        run: |
          missing=0

          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::error::OPENROUTER_API_KEY is not set"
            missing=1
          fi

          if [ -z "$NEWSDATA_API_KEY" ]; then
            echo "::error::NEWSDATA_API_KEY is not set"
            missing=1
          fi

          if [ -z "$DRY_RUN_FLAG" ]; then
            if [ -z "$AGENTMAIL_API_KEY" ]; then
              echo "::error::AGENTMAIL_API_KEY is not set"
              missing=1
            fi

            if [ -z "$AGENTMAIL_INBOX_ID" ]; then
              echo "::error::AGENTMAIL_INBOX_ID is not set"
              missing=1
            fi

            if [ -z "$EMAIL_FROM" ]; then
              echo "::error::EMAIL_FROM is not set"
              missing=1
            fi
          fi

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run radar pipeline
        env:
          MODE: ${{ steps.config.outputs.mode }}
          DRY_RUN_FLAG: ${{ steps.config.outputs.dry_run_flag }}
          JUAN_ONLY_FLAG: ${{ steps.config.outputs.juan_only_flag }}
          ANDYJUAN_PIPELINE_STUB_CAPTURE: ${{ runner.temp }}/daily-radar-ci-run-radar.json
        run: |
          run_args=(--mode "$MODE")
          if [ -n "$DRY_RUN_FLAG" ]; then
            run_args+=("$DRY_RUN_FLAG")
          fi
          if [ -n "$JUAN_ONLY_FLAG" ]; then
            run_args+=("$JUAN_ONLY_FLAG")
          fi
          python -m src.main "${run_args[@]}"

      - name: Show pipeline log tail
        if: always()
        run: |
          if [ -f data/logs/andyjuan.jsonl ]; then
            tail -n 200 data/logs/andyjuan.jsonl
          else
            echo "No pipeline log file found"
          fi

      - name: Upload pipeline logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-radar-logs
          path: data/logs/andyjuan.jsonl
          if-no-files-found: ignore
